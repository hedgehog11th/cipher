<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Cold-press paper, quiet: shallow tooth lit from the upper left, fine grain, soft mottling. -->
  <filter id="p" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="5" seed="4" stitchTiles="stitch" result="tooth"/>
    <feDiffuseLighting in="tooth" surfaceScale="2.2" diffuseConstant="1" lighting-color="#fff" result="lit">
      <feDistantLight azimuth="225" elevation="58"/>
    </feDiffuseLighting>
    <feComponentTransfer in="lit" result="shade">
      <feFuncR type="linear" slope="0.55" intercept="0.24"/><feFuncG type="linear" slope="0.55" intercept="0.24"/>
      <feFuncB type="linear" slope="0.55" intercept="0.24"/><feFuncA type="discrete" tableValues="1"/>
    </feComponentTransfer>
    <feFlood flood-color="#e1ddd4" result="base"/>
    <feBlend in="shade" in2="base" mode="soft-light" result="s1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" stitchTiles="stitch" result="g"/>
    <feColorMatrix in="g" type="saturate" values="0" result="gg"/>
    <feComponentTransfer in="gg" result="grain">
      <feFuncR type="linear" slope="0.30" intercept="0.35"/><feFuncG type="linear" slope="0.30" intercept="0.35"/>
      <feFuncB type="linear" slope="0.30" intercept="0.35"/><feFuncA type="discrete" tableValues="1"/>
    </feComponentTransfer>
    <feBlend in="grain" in2="s1" mode="soft-light" result="s2"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="2" stitchTiles="stitch" result="m"/>
    <feColorMatrix in="m" type="saturate" values="0" result="mm"/>
    <feComponentTransfer in="mm" result="mottle">
      <feFuncR type="linear" slope="0.32" intercept="0.34"/><feFuncG type="linear" slope="0.32" intercept="0.34"/>
      <feFuncB type="linear" slope="0.32" intercept="0.34"/><feFuncA type="discrete" tableValues="1"/>
    </feComponentTransfer>
    <feBlend in="mottle" in2="s2" mode="soft-light"/>
  </filter>
  <rect width="600" height="600" filter="url(#p)"/>
</svg>
